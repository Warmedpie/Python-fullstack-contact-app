<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">

        <!-- Left panel: contact list -->
        <aside id="contact-list-panel">

            <div id="contact-list-header">
                <h1>Contacts</h1>
                <button type="button" id="add-contact-btn" class="btn-round-add" aria-label="Add contact">+</button>
            </div>

            <div id="contact-list-toolbar">
                <input type="search" id="contact-search" placeholder="Search contacts…" aria-label="Search contacts">
                <button type="button" id="sort-toggle-btn" aria-label="Change sort order">Sort: Last name</button>
            </div>

            <!-- Populated at runtime from GET /api/contacts, filtered by the
                 search box and ordered by the current sort field. -->
            <ul id="contact-list"></ul>

        </aside>

        <!-- Right panel: selected contact's details -->
        <main id="contact-detail-panel">

            <!-- Populated at runtime from GET /api/contacts/<id> when a contact is selected.
                 Hidden by default: nothing to show until a contact is
                 selected or "+" starts a new one. -->
            <form id="contact-form" class="hidden" data-contact-id="">

                <!-- Shown when a save/add fails - e.g. a required field was
                     left blank. Populated with the backend's error message. -->
                <div id="form-error" class="hidden" role="alert"></div>

                <div id="name-fields">
                    <div class="form-field">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name">
                    </div>
                    <div class="form-field">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name">
                    </div>
                </div>

                <div class="form-field">
                    <label id="email-label">Email</label>

                    <!-- Populated from the selected contact's "emails" list -->
                    <ul id="email-list"></ul>

                    <button type="button" id="add-email-btn">
                        <span class="btn-round-add btn-round-add--sm" aria-hidden="true">+</span>
                        add email
                    </button>
                </div>

                <div id="form-actions">
                    <button type="button" id="delete-contact-btn">Delete</button>

                    <div id="form-actions-right">
                        <button type="button" id="cancel-btn" class="hidden">Cancel</button>
                        <button type="submit" id="save-btn">Save</button>
                    </div>
                </div>

            </form>

        </main>

    </div>

    <!-- Confirmation modal - hidden by default, shown before destructive
         actions (e.g. deleting a contact) instead of a native confirm(). -->
    <div id="confirm-overlay" class="hidden">
        <div id="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
            <p id="confirm-message"></p>
            <div id="confirm-actions">
                <button type="button" id="confirm-cancel-btn">Cancel</button>
                <button type="button" id="confirm-ok-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
